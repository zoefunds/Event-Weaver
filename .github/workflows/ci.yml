name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contract lint + schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install genvm-linter genlayer-test pytest
      - run: genvm-lint lint contracts/event_weaver.py --json
      # gltest.direct expects the GenVM tarball under ~/.cache/gltest-direct;
      # reuse the linter's download (the gltest asset URL 404s upstream).
      - run: |
          genvm-lint download
          mkdir -p ~/.cache/gltest-direct
          cp ~/.cache/genvm-linter/genvm-universal-*.tar.xz ~/.cache/gltest-direct/
      - run: pytest tests/direct/ -v

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: backend
      - run: node --check src/server.js
        working-directory: backend

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
