# EventWeaver API — 24/7 availability configuration.
app = "eventweaver-api-prod"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  POLL_INTERVAL_MS = "15000"

[http_service]
  internal_port = 8080
  force_https = true
  # Never scale to zero — the indexer and API must run 24/7.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

# Always restart on failure — belt and braces with the in-process
# never-die posture in server.js.
[[restart]]
  policy = "always"
  retries = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
