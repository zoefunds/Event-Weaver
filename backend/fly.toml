# EventWeaver API — 24/7 availability configuration.
app = "eventweaver-api-v2"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # StudioNet's shared RPC caps at 500 reads/hour (see config.js). The 45s
  # value this used to be set to was tuned against an older, looser 30/min
  # cap and blew through the current budget on its own — indexer + resolver
  # polling alone exceeded 500/hour with zero user traffic, surfacing as
  # /api/config and other live-read routes returning 500. 300000 (5 min)
  # matches config.js's own default and leaves headroom for real requests.
  POLL_INTERVAL_MS = "300000"

[http_service]
  internal_port = 8080
  force_https = true
  # Never scale to zero — the indexer and API must run 24/7.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

# Always restart on failure — belt and braces with the in-process
# never-die posture in server.js.
[[restart]]
  policy = "always"
  retries = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
